version: "3.9"

services:
  huangguo:
    build:
      context: .
      dockerfile: Dockerfile
    image: jokermelove/huangguo-collector:1.4.0
    container_name: huangguo-collector
    restart: unless-stopped
    init: true
    ports:
      - "8765:8765"
    environment:
      TZ: Asia/Shanghai
      HUANGGUO_DATA_DIR: /data
      HUANGGUO_DOWNLOAD_ROOT: /downloads
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
